name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18.20.8", "22"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Install and verify packed CLI
        run: npm run verify:package

      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          path: tmp/m7-4-package-report.json
          if-no-files-found: error

      - name: Install pinned native OpenCode
        if: matrix.node == '22'
        run: npm install --prefix tmp/opencode --no-package-lock --no-save @opencode/cli@2.0.12

      - name: Verify default source paths and native import
        if: matrix.node == '22'
        run: npm run verify:platform
        env:
          T2O_TEST_OPENCODE_BINARY: tmp/opencode/node_modules/@opencode/cli/bin/opencode.exe

      - name: Install real adjacent OpenCode binary
        if: matrix.node == '22'
        run: npm install --prefix tmp/opencode-adjacent --no-package-lock --no-save @opencode/cli@2.0.11

      - name: Install OpenCode 2.0.18 for the public command regression
        if: matrix.node == '22'
        run: npm install --prefix tmp/opencode-unreviewed --no-package-lock --no-save @opencode/cli@2.0.18

      - name: Run public roundtrip command with baseline v2
        if: matrix.node == '22'
        run: npm run verify:opencode -- --binary tmp/opencode/node_modules/@opencode/cli/bin/opencode.exe --output tmp/roundtrip-v2-baseline

      - name: Run public roundtrip command with unreviewed v2
        if: matrix.node == '22'
        run: npm run verify:opencode -- --binary tmp/opencode-unreviewed/node_modules/@opencode/cli/bin/opencode.exe --output tmp/roundtrip-v2-unreviewed

      - name: Verify current and adjacent version contracts
        if: matrix.node == '22'
        run: npm run verify:versions
        env:
          T2O_TEST_OPENCODE_BINARY: tmp/opencode/node_modules/@opencode/cli/bin/opencode.exe

      - name: Install baseline and unreviewed OpenCode v1
        if: matrix.node == '22'
        run: |
          npm install --prefix tmp/opencode-v1-current --no-package-lock --no-save opencode-ai@1.18.32
          npm install --prefix tmp/opencode-v1-unreviewed --no-package-lock --no-save opencode-ai@1.18.31

      - name: Verify v1 protocol compatibility and recovery
        if: matrix.node == '22'
        run: npm run verify:integration:v1
        env:
          T2O_TEST_OPENCODE_BINARY: tmp/opencode-v1-current/node_modules/opencode-ai/bin/opencode.exe
          T2O_TEST_V1_ADJACENT_BINARY: tmp/opencode-v1-unreviewed/node_modules/opencode-ai/bin/opencode.exe

      - name: Run public roundtrip command with baseline v1
        if: matrix.node == '22'
        run: npm run verify:opencode -- --binary tmp/opencode-v1-current/node_modules/opencode-ai/bin/opencode.exe --output tmp/roundtrip-v1-baseline

      - name: Run public roundtrip command with unreviewed v1
        if: matrix.node == '22'
        run: npm run verify:opencode -- --binary tmp/opencode-v1-unreviewed/node_modules/opencode-ai/bin/opencode.exe --output tmp/roundtrip-v1-unreviewed

      - name: Run public roundtrip command with both installed dialects
        if: matrix.node == '22'
        run: npm run verify:opencode -- --output tmp/roundtrip-combined
        env:
          T2O_OPENCODE_V1_BINARY: tmp/opencode-v1-current/node_modules/opencode-ai/bin/opencode.exe
          T2O_OPENCODE_V2_BINARY: tmp/opencode/node_modules/@opencode/cli/bin/opencode.exe

      - name: Verify one bundle against v1 and v2 targets
        if: matrix.node == '22'
        run: npm run verify:multi-target
        env:
          T2O_TEST_OPENCODE_V1_BINARY: tmp/opencode-v1-current/node_modules/opencode-ai/bin/opencode.exe
          T2O_TEST_OPENCODE_V2_BINARY: tmp/opencode/node_modules/@opencode/cli/bin/opencode.exe

      - name: Verify bounded heap and process interruption recovery
        if: matrix.node == '22'
        run: npm run verify:resilience
        env:
          T2O_TEST_OPENCODE_BINARY: tmp/opencode/node_modules/@opencode/cli/bin/opencode.exe

      - name: Upload integration evidence
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}
          path: |
            tmp/m7-1-platform-report.json
            tmp/m7-2-version-report.json
            tmp/m7-3-resilience-report.json
            tmp/multi-target/report.json
            tmp/multi-target/*/migration-manifest.json
            tmp/roundtrip-combined/report.json
            tmp/roundtrip-combined/*/report.json
            tmp/roundtrip-combined/*/*.schema.json
            tmp/roundtrip-v*/report.json
            tmp/roundtrip-v*/*.schema.json
          if-no-files-found: warn
