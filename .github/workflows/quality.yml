name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18.20.8", "22"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Install pinned native OpenCode
        if: matrix.node == '22'
        run: npm install --prefix tmp/opencode --no-package-lock --no-save @opencode/cli@2.0.12

      - name: Verify default source paths and native import
        if: matrix.node == '22'
        run: npm run verify:platform
        env:
          T2O_TEST_OPENCODE_BINARY: tmp/opencode/node_modules/@opencode/cli/bin/opencode.exe

      - name: Upload integration evidence
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}
          path: tmp/m7-1-platform-report.json
          if-no-files-found: warn
